[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cddh"
version = "1.0.0"
description = "Humidity-aware cooling degree days: gridded CDD, population-weighted country/region aggregation, growth-factor decomposition"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "netCDF4>=1.6"]

[project.optional-dependencies]
land = ["geopandas>=0.14", "shapely>=2.0"]
population = ["rasterio>=1.3"]
test = ["pytest>=7"]

[project.scripts]
cddh = "cddh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
